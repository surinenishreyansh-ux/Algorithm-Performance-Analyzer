<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithm Performance Analyzer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <div class="header">
        <h1>Algorithm Performance Analyzer</h1>
        <p>
            Compare sorting algorithms using execution time
            and theoretical complexity.
        </p>
    </div>

    <div class="input-box">
        <label>Enter Numbers</label>

        <div class="input-group">
            <input
                type="text"
                id="numbers"
                placeholder="Example: 5, 2, 9, 1, 7, 4"
            >

            <button onclick="generateRandom()" class="random-btn">
                Random
            </button>
        </div>

        <button onclick="compareSorts()" id="compareBtn">
            Run Analysis
        </button>
    </div>

    <div id="error" class="error-message"></div>

    <div class="results" id="results"></div>

</div>

<script>

function generateRandom() {
    const count = Math.floor(Math.random() * 20) + 10;

    const arr = Array.from(
        { length: count },
        () => Math.floor(Math.random() * 100)
    );

    document.getElementById('numbers').value =
        arr.join(', ');
}


async function compareSorts() {

    const numbers =
        document.getElementById('numbers').value;

    const errorDiv =
        document.getElementById('error');

    const resultsDiv =
        document.getElementById('results');

    if (!numbers.trim()) {

        errorDiv.style.display = 'block';
        errorDiv.innerText =
            'Please enter numbers.';

        return;
    }

    errorDiv.style.display = 'none';

    try {

        const response = await fetch('/sort', {
            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

            body: JSON.stringify({
                numbers
            })
        });

        const data = await response.json();

        if (!response.ok) {
            errorDiv.style.display = 'block';
            errorDiv.innerText =
                data.error;

            return;
        }

        const bubbleTime =
            parseFloat(data.bubble_time);

        const mergeTime =
            parseFloat(data.merge_time);

        const bubbleWinner =
            bubbleTime <= mergeTime
                ? 'winner'
                : '';

        const mergeWinner =
            mergeTime < bubbleTime
                ? 'winner'
                : '';

        resultsDiv.innerHTML = `
            <div class="card ${bubbleWinner}">
                <h2>Bubble Sort</h2>

                <p>
                    <strong>Complexity:</strong>
                    ${data.bubble_complexity}
                </p>

                <p>
                    <strong>Execution Time:</strong>
                    ${data.bubble_time} sec
                </p>

                <p>
                    <strong>Sorted Array:</strong>
                    ${data.bubble_sorted.join(", ")}
                </p>
            </div>

            <div class="card ${mergeWinner}">
                <h2>Merge Sort</h2>

                <p>
                    <strong>Complexity:</strong>
                    ${data.merge_complexity}
                </p>

                <p>
                    <strong>Execution Time:</strong>
                    ${data.merge_time} sec
                </p>

                <p>
                    <strong>Sorted Array:</strong>
                    ${data.merge_sorted.join(", ")}
                </p>
            </div>
        `;
    }

    catch (error) {

        errorDiv.style.display = 'block';

        errorDiv.innerText =
            'Server connection failed.';
    }
}

</script>

</body>
</html>
